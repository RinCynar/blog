<!-- Search dialog -->

<div
  id="search-dialog"
  class="md-search-dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="search-input"
  hidden
>
  <div class="md-search-surface">
    <search id="search" class="align-items-center">
      <i class="fas fa-search fa-fw" aria-hidden="true"></i>
      <input
        class="form-control"
        id="search-input"
        type="search"
        aria-label="{{ site.data.locales[include.lang].search.hint | capitalize }}"
        autocomplete="off"
        placeholder="{{ site.data.locales[include.lang].search.hint | capitalize }}..."
      >
      <button type="button" class="md-text-btn" id="search-cancel">
        {{- site.data.locales[include.lang].search.cancel -}}
      </button>
    </search>

    <div id="search-result-wrapper">
      <div id="search-hints">
        {% include_cached trending-tags.html %}
      </div>
      <div id="search-results" class="text-muted"></div>
    </div>
  </div>
</div>
