<!-- The Footer -->

<footer aria-label="Site info" class="md-footer">
  <p class="md-footer-brand">
    {% if site.social.links %}
    <a href="{{ site.social.links[0] }}">{{ site.title }}</a>
    {% else %}
    <span>{{ site.title }}</span>
    {% endif %}
  </p>

  <p class="md-footer-links">
    <a href="https://github.com/{{ site.github.username }}" target="_blank" rel="noopener">GitHub</a>
    <span class="md-footer-sep" aria-hidden="true">·</span>
    <a href="https://x.com/{{ site.twitter.username }}" target="_blank" rel="noopener">X</a>
    <span class="md-footer-sep" aria-hidden="true">·</span>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <span class="md-footer-sep" aria-hidden="true">·</span>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </p>

  <p class="md-footer-copy">
    {{- '©' }}
    <time>{{ 'now' | date: '%Y' }}</time>
    {{ site.social.name }}
  </p>
</footer>
