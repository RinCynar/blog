<!-- Material You Language Switcher Interaction -->
<script>
  (function () {
    const langToggle = document.getElementById('lang-toggle');
    const langMenu = document.getElementById('lang-menu');
    if (!langToggle || !langMenu) return;

    function toggleMenu(show) {
      const isExpanded = show !== undefined ? show : langMenu.hasAttribute('hidden');
      if (isExpanded) {
        langMenu.removeAttribute('hidden');
        langToggle.setAttribute('aria-expanded', 'true');
      } else {
        langMenu.setAttribute('hidden', '');
        langToggle.setAttribute('aria-expanded', 'false');
      }
    }

    langToggle.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu();
    });

    document.addEventListener('click', function (e) {
      if (!langMenu.contains(e.target) && e.target !== langToggle && !langToggle.contains(e.target)) {
        toggleMenu(false);
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        toggleMenu(false);
      }
    });

    const items = langMenu.querySelectorAll('.md-lang-item');
    items.forEach(function (btn) {
      btn.addEventListener('click', function () {
        const targetLang = btn.getAttribute('data-lang');
        if (!targetLang) return;

        try {
          localStorage.setItem('pref-lang', targetLang.startsWith('zh') ? 'zh-CN' : targetLang);
          sessionStorage.removeItem('auto-lang-redirected');
        } catch (e) {}

        const currentPath = window.location.pathname;
        const isZh = currentPath.startsWith('/zh/') || currentPath === '/zh';
        const isJa = currentPath.startsWith('/ja/') || currentPath === '/ja';

        let canonicalPath = currentPath;
        if (isZh) {
          canonicalPath = currentPath.replace(/^\/zh/, '') || '/';
        } else if (isJa) {
          canonicalPath = currentPath.replace(/^\/ja/, '') || '/';
        }
        if (canonicalPath === '/index.html') {
          canonicalPath = '/';
        }

        let targetUrl = canonicalPath;
        const isDetailArchive = (canonicalPath.startsWith('/tags/') && canonicalPath !== '/tags/') ||
                                (canonicalPath.startsWith('/categories/') && canonicalPath !== '/categories/');

        if (isDetailArchive) {
          targetUrl = '{{ "" | relative_url }}' + canonicalPath;
        } else if (targetLang === 'zh-CN' || targetLang === 'zh') {
          targetUrl = canonicalPath === '/' ? '{{ "/zh/" | relative_url }}' : ('{{ "/zh" | relative_url }}' + canonicalPath);
        } else if (targetLang === 'ja') {
          targetUrl = canonicalPath === '/' ? '{{ "/ja/" | relative_url }}' : ('{{ "/ja" | relative_url }}' + canonicalPath);
        } else {
          // English fallback / default: Root URL without prefix
          targetUrl = canonicalPath === '/' ? '{{ "/" | relative_url }}' : ('{{ "" | relative_url }}' + canonicalPath);
        }

        targetUrl = targetUrl.replace(/\/+/g, '/') + window.location.search + window.location.hash;
        window.location.href = targetUrl;
      });
    });
  })();
</script>
